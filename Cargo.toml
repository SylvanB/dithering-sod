[package]
name = "dithering-sod"
version = "0.1.0"
edition = "2021"
description = "A desktop image-processing app for dithering, halftoning, palettes, and composable effects"
license = "MIT"
repository = "https://github.com/SylvanB/dithering-sod"
keywords = ["dithering", "halftone", "image-processing", "egui"]
categories = ["graphics", "multimedia::images"]

[dependencies]
eframe = { version = "0.29", features = ["default"] }
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff", "gif", "webp"] }
rfd = "0.15"
arboard = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
